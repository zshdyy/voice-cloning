<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 660" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1800" height="660" fill="#F5F4EF"/>

<!-- Title -->
<text x="900" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1C2833" letter-spacing="0.3">Speech Anonymization Pipeline — 5-Stage Processing Flow</text>

<!-- ═══════════════════════════════════════════════════════════
     STAGE COLUMN BACKGROUNDS
═══════════════════════════════════════════════════════════ -->

<!-- S1 bg -->
<rect x="16" y="58" width="270" height="580" rx="12" fill="#E8F4FD" stroke="#2980B9" stroke-width="2"/>
<!-- S2 bg -->
<rect x="304" y="58" width="270" height="580" rx="12" fill="#FEF5E7" stroke="#E67E22" stroke-width="2"/>
<!-- S3 bg -->
<rect x="592" y="58" width="270" height="580" rx="12" fill="#EAFAF1" stroke="#27AE60" stroke-width="2"/>
<!-- S4 bg -->
<rect x="880" y="58" width="622" height="580" rx="12" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
<!-- S5 bg -->
<rect x="1520" y="58" width="264" height="580" rx="12" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2"/>

<!-- ═══════════════════════════════════════════════════════════
     STAGE HEADERS
═══════════════════════════════════════════════════════════ -->

<rect x="16" y="58" width="270" height="44" rx="12" fill="#2980B9"/>
<rect x="16" y="90" width="270" height="12" fill="#2980B9"/>
<text x="151" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stage 1 · Input</text>

<rect x="304" y="58" width="270" height="44" rx="12" fill="#E67E22"/>
<rect x="304" y="90" width="270" height="12" fill="#E67E22"/>
<text x="439" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stage 2 · Preprocessing</text>

<rect x="592" y="58" width="270" height="44" rx="12" fill="#27AE60"/>
<rect x="592" y="90" width="270" height="12" fill="#27AE60"/>
<text x="727" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stage 3 · Feature Extraction</text>

<rect x="880" y="58" width="622" height="44" rx="12" fill="#8E44AD"/>
<rect x="880" y="90" width="622" height="12" fill="#8E44AD"/>
<text x="1191" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stage 4 · Anonymization  (3 Method Variants)</text>

<rect x="1520" y="58" width="264" height="44" rx="12" fill="#E74C3C"/>
<rect x="1520" y="90" width="264" height="12" fill="#E74C3C"/>
<text x="1652" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stage 5 · Evaluation</text>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 1: INPUT
═══════════════════════════════════════════════════════════ -->

<!-- Source Audio box -->
<rect x="32" y="116" width="238" height="128" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="32" y="116" width="238" height="32" rx="8" fill="#D6EAF8"/>
<rect x="32" y="136" width="238" height="12" fill="#D6EAF8"/>
<text x="151" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#1A5276">Source Audio  (Speaker A)</text>
<text x="151" y="164" text-anchor="middle" font-size="11" fill="#333">Original speech to anonymize</text>
<text x="151" y="182" text-anchor="middle" font-size="11" fill="#555">Format: .wav / .mp3 / .m4a</text>
<text x="151" y="200" text-anchor="middle" font-size="10.5" fill="#777">Duration: recommended 3–10 s</text>
<text x="151" y="218" text-anchor="middle" font-size="10.5" fill="#777">Sample rate: any (auto-converted)</text>

<!-- Target Voice Pool box -->
<rect x="32" y="262" width="238" height="148" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="32" y="262" width="238" height="32" rx="8" fill="#D6EAF8"/>
<rect x="32" y="282" width="238" height="12" fill="#D6EAF8"/>
<text x="151" y="283" text-anchor="middle" font-size="12" font-weight="700" fill="#1A5276">Target Voice Pool</text>
<text x="151" y="311" text-anchor="middle" font-size="11" fill="#333">N = 9 candidate speakers</text>
<text x="151" y="329" text-anchor="middle" font-size="11" fill="#555">Pre-built embedding sets:</text>
<text x="151" y="347" text-anchor="middle" font-size="11" fill="#555">  male_leaning</text>
<text x="151" y="365" text-anchor="middle" font-size="11" fill="#555">  female_leaning</text>
<text x="151" y="387" text-anchor="middle" font-size="10.5" fill="#777">Speaker identity fingerprints</text>

<!-- ═══════════════════════════════════════════════════════════
     INTER-STAGE ARROWS
═══════════════════════════════════════════════════════════ -->
<line x1="286" y1="340" x2="302" y2="340" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<line x1="574" y1="340" x2="590" y2="340" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<line x1="862" y1="340" x2="878" y2="340" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1502" y1="340" x2="1518" y2="340" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 2: PREPROCESSING
═══════════════════════════════════════════════════════════ -->

<!-- Step A -->
<rect x="320" y="116" width="238" height="100" rx="8" fill="white" stroke="#E67E22" stroke-width="1.5"/>
<rect x="320" y="116" width="238" height="30" rx="8" fill="#FDEBD0"/>
<rect x="320" y="134" width="238" height="12" fill="#FDEBD0"/>
<text x="439" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">① Amplitude Normalization</text>
<text x="439" y="162" text-anchor="middle" font-size="11" fill="#333">Normalize audio amplitude</text>
<text x="439" y="179" text-anchor="middle" font-size="11" fill="#333">to a standard range</text>
<text x="439" y="198" text-anchor="middle" font-size="10.5" fill="#777">prevents clipping &amp; overdriving</text>

<!-- Down arrow -->
<line x1="439" y1="216" x2="439" y2="232" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Step B -->
<rect x="320" y="236" width="238" height="100" rx="8" fill="white" stroke="#E67E22" stroke-width="1.5"/>
<rect x="320" y="236" width="238" height="30" rx="8" fill="#FDEBD0"/>
<rect x="320" y="254" width="238" height="12" fill="#FDEBD0"/>
<text x="439" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">② Sample Rate Unification</text>
<text x="439" y="282" text-anchor="middle" font-size="11" fill="#333">ffmpeg → 16 kHz mono</text>
<text x="439" y="299" text-anchor="middle" font-size="11" fill="#333">16-bit PCM WAV</text>
<text x="439" y="318" text-anchor="middle" font-size="10.5" fill="#777">ensures model compatibility</text>

<!-- Down arrow -->
<line x1="439" y1="336" x2="439" y2="352" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Step C -->
<rect x="320" y="356" width="238" height="100" rx="8" fill="white" stroke="#E67E22" stroke-width="1.5"/>
<rect x="320" y="356" width="238" height="30" rx="8" fill="#FDEBD0"/>
<rect x="320" y="374" width="238" height="12" fill="#FDEBD0"/>
<text x="439" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#784212">③ Denoising</text>
<text x="439" y="402" text-anchor="middle" font-size="11" fill="#333">3 selectable intensities:</text>
<text x="439" y="419" text-anchor="middle" font-size="11" fill="#333">light  /  standard  /  strong</text>
<text x="439" y="438" text-anchor="middle" font-size="10.5" fill="#777">spectral subtraction method</text>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 3: FEATURE EXTRACTION
═══════════════════════════════════════════════════════════ -->

<!-- Content Encoder -->
<rect x="608" y="116" width="238" height="160" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5"/>
<rect x="608" y="116" width="238" height="30" rx="8" fill="#D5F5E3"/>
<rect x="608" y="134" width="238" height="12" fill="#D5F5E3"/>
<text x="727" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#145A32">Content Encoder (PPG)</text>
<text x="727" y="163" text-anchor="middle" font-size="11" fill="#333">Phonetic PosteriorGrams</text>
<text x="727" y="181" text-anchor="middle" font-size="11" fill="#333">Speaker-independent content</text>
<text x="727" y="199" text-anchor="middle" font-size="11" fill="#333">representation</text>
<text x="727" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1D8348">PPG  ∈  ℝ^{T × D}</text>
<text x="727" y="241" text-anchor="middle" font-size="10.5" fill="#777">T = frames,  D = feature dim</text>
<text x="727" y="258" text-anchor="middle" font-size="10.5" fill="#777">preserves phoneme-level content</text>

<!-- Down arrow -->
<line x1="727" y1="276" x2="727" y2="292" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Speaker Embedding -->
<rect x="608" y="296" width="238" height="138" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5"/>
<rect x="608" y="296" width="238" height="30" rx="8" fill="#D5F5E3"/>
<rect x="608" y="314" width="238" height="12" fill="#D5F5E3"/>
<text x="727" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#145A32">Speaker Embedding</text>
<text x="727" y="343" text-anchor="middle" font-size="11" fill="#333">Extract d-vector from each</text>
<text x="727" y="361" text-anchor="middle" font-size="11" fill="#333">candidate in target voice pool</text>
<text x="727" y="379" text-anchor="middle" font-size="11" fill="#333">Speaker identity fingerprint</text>
<text x="727" y="398" text-anchor="middle" font-size="10.5" fill="#777">→ N embeddings total</text>
<text x="727" y="416" text-anchor="middle" font-size="10.5" fill="#777">via OpenVoice speaker encoder</text>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 4: THREE METHODS
═══════════════════════════════════════════════════════════ -->

<!-- Method column backgrounds -->
<rect x="896" y="112" width="190" height="504" rx="8" fill="white" stroke="#3498DB" stroke-width="1.5"/>
<rect x="1100" y="112" width="190" height="504" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5"/>
<rect x="1304" y="112" width="190" height="504" rx="8" fill="white" stroke="#8E44AD" stroke-width="1.5"/>

<!-- Method 1 header -->
<rect x="896" y="112" width="190" height="34" rx="8" fill="#AED6F1"/>
<rect x="896" y="134" width="190" height="12" fill="#AED6F1"/>
<text x="991" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A5276">① freevc_baseline</text>

<!-- Method 2 header -->
<rect x="1100" y="112" width="190" height="34" rx="8" fill="#A9DFBF"/>
<rect x="1100" y="134" width="190" height="12" fill="#A9DFBF"/>
<text x="1195" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#145A32">② metric_clarity</text>

<!-- Method 3 header -->
<rect x="1304" y="112" width="190" height="34" rx="8" fill="#D7BDE2"/>
<rect x="1304" y="134" width="190" height="12" fill="#D7BDE2"/>
<text x="1399" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A235A">③ ppg_tone</text>

<!-- M1 subtitle + body -->
<text x="991" y="163" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Balanced Baseline</text>
<line x1="906" y1="172" x2="1076" y2="172" stroke="#AED6F1" stroke-width="1"/>
<text x="991" y="192" text-anchor="middle" font-size="10.5" fill="#222">PPG content features</text>
<text x="991" y="210" text-anchor="middle" font-size="10.5" fill="#222">+ target embedding</text>
<text x="991" y="228" text-anchor="middle" font-size="10.5" fill="#222">direct combination</text>
<line x1="906" y1="240" x2="1076" y2="240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="991" y="258" text-anchor="middle" font-size="10.5" fill="#444">Standard FreeVC</text>
<text x="991" y="276" text-anchor="middle" font-size="10.5" fill="#444">tone transfer</text>
<line x1="906" y1="288" x2="1076" y2="288" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="991" y="306" text-anchor="middle" font-size="10.5" fill="#444">Generate N candidates</text>
<text x="991" y="324" text-anchor="middle" font-size="10.5" fill="#444">pick first</text>
<line x1="906" y1="338" x2="1076" y2="338" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="991" y="358" text-anchor="middle" font-size="10" fill="#888">▸ highest timbre removal</text>
<text x="991" y="376" text-anchor="middle" font-size="10" fill="#888">▸ lowest source_sim</text>
<text x="991" y="394" text-anchor="middle" font-size="10" fill="#888">▸ most de-identified</text>
<text x="991" y="412" text-anchor="middle" font-size="10" fill="#888">▸ source_sim = 0.125</text>

<!-- M2 subtitle + body -->
<text x="1195" y="163" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Clarity-Priority</text>
<line x1="1110" y1="172" x2="1280" y2="172" stroke="#A9DFBF" stroke-width="1"/>
<text x="1195" y="192" text-anchor="middle" font-size="10.5" fill="#222">Iterate N candidate</text>
<text x="1195" y="210" text-anchor="middle" font-size="10.5" fill="#222">audio outputs</text>
<line x1="1110" y1="222" x2="1280" y2="222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1195" y="242" text-anchor="middle" font-size="10.5" fill="#444">Acoustic scoring:</text>
<text x="1195" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#1D8348">score = α×SpecDist</text>
<text x="1195" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#1D8348">     + β×EnvCorr</text>
<text x="1195" y="298" text-anchor="middle" font-size="10" fill="#777">(α + β = 1)</text>
<line x1="1110" y1="310" x2="1280" y2="310" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1195" y="330" text-anchor="middle" font-size="10.5" fill="#444">Weighted ranking →</text>
<text x="1195" y="348" text-anchor="middle" font-size="10.5" fill="#444">select highest score</text>
<line x1="1110" y1="360" x2="1280" y2="360" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1195" y="380" text-anchor="middle" font-size="10" fill="#888">▸ better envelope fidelity</text>
<text x="1195" y="398" text-anchor="middle" font-size="10" fill="#888">▸ utility-first: best quality</text>
<text x="1195" y="416" text-anchor="middle" font-size="10" fill="#888">▸ source_sim = 0.146</text>

<!-- M3 subtitle + body -->
<text x="1399" y="163" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Content-Priority</text>
<line x1="1314" y1="172" x2="1484" y2="172" stroke="#D7BDE2" stroke-width="1"/>
<text x="1399" y="192" text-anchor="middle" font-size="10.5" fill="#222">PPG content fidelity</text>
<text x="1399" y="210" text-anchor="middle" font-size="10.5" fill="#222">evaluation first</text>
<line x1="1314" y1="222" x2="1484" y2="222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1399" y="242" text-anchor="middle" font-size="10.5" fill="#444">Content feature</text>
<text x="1399" y="260" text-anchor="middle" font-size="10.5" fill="#444">consistency priority</text>
<line x1="1314" y1="272" x2="1484" y2="272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1399" y="292" text-anchor="middle" font-size="10.5" fill="#444">Tone assists adjustment</text>
<text x="1399" y="310" text-anchor="middle" font-size="10.5" fill="#444">balance content &amp;</text>
<text x="1399" y="328" text-anchor="middle" font-size="10.5" fill="#444">acoustic quality</text>
<line x1="1314" y1="340" x2="1484" y2="340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1399" y="360" text-anchor="middle" font-size="10" fill="#888">▸ envelope shape closest</text>
<text x="1399" y="378" text-anchor="middle" font-size="10" fill="#888">  to original signal</text>
<text x="1399" y="396" text-anchor="middle" font-size="10" fill="#888">▸ source_sim = 0.146</text>

<!-- Output chips at bottom -->
<rect x="910" y="568" width="162" height="34" rx="8" fill="#AED6F1" stroke="#2980B9" stroke-width="1.5"/>
<text x="991" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#1A5276">Anon Audio  A</text>

<rect x="1114" y="568" width="162" height="34" rx="8" fill="#A9DFBF" stroke="#27AE60" stroke-width="1.5"/>
<text x="1195" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">Anon Audio  B</text>

<rect x="1318" y="568" width="162" height="34" rx="8" fill="#D7BDE2" stroke="#8E44AD" stroke-width="1.5"/>
<text x="1399" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#4A235A">Anon Audio  C</text>

<!-- ═══════════════════════════════════════════════════════════
     STAGE 5: EVALUATION
═══════════════════════════════════════════════════════════ -->

<!-- Metric 1: ASV-EER -->
<rect x="1536" y="112" width="232" height="96" rx="8" fill="white" stroke="#E74C3C" stroke-width="1.5"/>
<rect x="1536" y="112" width="232" height="28" rx="8" fill="#FADBD8"/>
<rect x="1536" y="128" width="232" height="12" fill="#FADBD8"/>
<text x="1652" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#922B21">ASV-EER  ↑</text>
<text x="1652" y="155" text-anchor="middle" font-size="10.5" fill="#333">Auto speaker verification EER</text>
<text x="1652" y="172" text-anchor="middle" font-size="10.5" fill="#333">↑ higher → harder to identify</text>
<text x="1652" y="189" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E74C3C">Privacy metric</text>

<!-- Metric 2: ASR-WER -->
<rect x="1536" y="220" width="232" height="96" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="1536" y="220" width="232" height="28" rx="8" fill="#D6EAF8"/>
<rect x="1536" y="236" width="232" height="12" fill="#D6EAF8"/>
<text x="1652" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1A5276">ASR-WER  ↓</text>
<text x="1652" y="263" text-anchor="middle" font-size="10.5" fill="#333">Automatic speech recognition</text>
<text x="1652" y="280" text-anchor="middle" font-size="10.5" fill="#333">↓ lower → content preserved</text>
<text x="1652" y="297" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2980B9">Utility metric</text>

<!-- Metric 3: source_sim -->
<rect x="1536" y="328" width="232" height="96" rx="8" fill="white" stroke="#E74C3C" stroke-width="1.5"/>
<rect x="1536" y="328" width="232" height="28" rx="8" fill="#FADBD8"/>
<rect x="1536" y="344" width="232" height="12" fill="#FADBD8"/>
<text x="1652" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#922B21">source_sim  ↓</text>
<text x="1652" y="371" text-anchor="middle" font-size="10.5" fill="#333">Cosine similarity to source</text>
<text x="1652" y="388" text-anchor="middle" font-size="10.5" fill="#333">↓ lower → de-identified</text>
<text x="1652" y="405" text-anchor="middle" font-size="10.5" font-weight="600" fill="#E74C3C">Privacy metric</text>

<!-- Metric 4: content_kept -->
<rect x="1536" y="436" width="232" height="96" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5"/>
<rect x="1536" y="436" width="232" height="28" rx="8" fill="#D5F5E3"/>
<rect x="1536" y="452" width="232" height="12" fill="#D5F5E3"/>
<text x="1652" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#145A32">content_kept  ↑</text>
<text x="1652" y="479" text-anchor="middle" font-size="10.5" fill="#333">1 − WER</text>
<text x="1652" y="496" text-anchor="middle" font-size="10.5" fill="#333">↑ higher → more retained</text>
<text x="1652" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#27AE60">Utility metric</text>

<!-- Report chip -->
<rect x="1536" y="548" width="232" height="44" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
<text x="1652" y="567" text-anchor="middle" font-size="11" font-weight="700" fill="#7D6608">pipeline_report.json</text>
<text x="1652" y="584" text-anchor="middle" font-size="10" fill="#888">complete evaluation report</text>

</svg>
