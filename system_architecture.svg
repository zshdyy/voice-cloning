<text x="1562" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="white">OUTPUT  LAYER</text>

<!-- ══ INPUT BOXES ══ -->
<rect x="28" y="148" width="220" height="120" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="28" y="148" width="220" height="28" rx="8" fill="#D6EAF8"/><rect x="28" y="164" width="220" height="12" fill="#D6EAF8"/>
<text x="138" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A5276">① Single Audio</text>
<text x="138" y="192" text-anchor="middle" font-size="10.5" fill="#444">.wav / .mp3 / .m4a</text>
<text x="138" y="210" text-anchor="middle" font-size="10.5" fill="#666">one audio file</text>
<text x="138" y="228" text-anchor="middle" font-size="10.5" fill="#666">for gender conversion</text>
<text x="138" y="248" text-anchor="middle" font-size="10" fill="#999">parametric mode</text>

<rect x="28" y="296" width="220" height="120" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="28" y="296" width="220" height="28" rx="8" fill="#D6EAF8"/><rect x="28" y="312" width="220" height="12" fill="#D6EAF8"/>
<text x="138" y="314" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A5276">② Source + Reference</text>
<text x="138" y="342" text-anchor="middle" font-size="10.5" fill="#444">source audio to convert</text>
<text x="138" y="360" text-anchor="middle" font-size="10.5" fill="#666">+ target reference audio</text>
<text x="138" y="378" text-anchor="middle" font-size="10.5" fill="#666">dual-audio input</text>
<text x="138" y="396" text-anchor="middle" font-size="10" fill="#999">voice cloning mode</text>

<rect x="28" y="444" width="220" height="120" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="28" y="444" width="220" height="28" rx="8" fill="#D6EAF8"/><rect x="28" y="460" width="220" height="12" fill="#D6EAF8"/>
<text x="138" y="462" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A5276">③ Ref + Audio-to-Eval</text>
<text x="138" y="490" text-anchor="middle" font-size="10.5" fill="#444">reference audio</text>
<text x="138" y="508" text-anchor="middle" font-size="10.5" fill="#666">+ audio-to-evaluate</text>
<text x="138" y="526" text-anchor="middle" font-size="10.5" fill="#666">pair comparison</text>
<text x="138" y="544" text-anchor="middle" font-size="10" fill="#999">similarity evaluation</text>

<rect x="28" y="592" width="220" height="180" rx="8" fill="white" stroke="#2980B9" stroke-width="1.5"/>
<rect x="28" y="592" width="220" height="28" rx="8" fill="#D6EAF8"/><rect x="28" y="608" width="220" height="12" fill="#D6EAF8"/>
<text x="138" y="610" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A5276">④ Source + Voice Pool</text>
<text x="138" y="638" text-anchor="middle" font-size="10.5" fill="#444">source audio (Speaker A)</text>
<text x="138" y="656" text-anchor="middle" font-size="10.5" fill="#666">+ target voice pool</text>
<text x="138" y="674" text-anchor="middle" font-size="10.5" fill="#666">N = 9 candidates</text>
<text x="138" y="692" text-anchor="middle" font-size="10.5" fill="#666">male / female pools</text>
<text x="138" y="710" text-anchor="middle" font-size="10.5" fill="#666">pre-built embeddings</text>
<text x="138" y="730" text-anchor="middle" font-size="10" fill="#999">anonymization mode</text>
<text x="138" y="748" text-anchor="middle" font-size="10" fill="#999">→ 3 output variants</text>

<!-- ══ MODULE 1: WORLD ══ -->
<rect x="294" y="138" width="1112" height="160" rx="10" fill="#EDE7F6" stroke="#6C3483" stroke-width="1.8"/>
<rect x="294" y="138" width="1112" height="34" rx="10" fill="#6C3483"/><rect x="294" y="160" width="1112" height="12" fill="#6C3483"/>
<text x="850" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="white">Module 1 — WORLD Single-Audio Voice Conversion</text>
<text x="850" y="180" text-anchor="middle" font-size="10.5" fill="#CCC">Traditional Signal Processing  |  Vocoder-Based Parametric Decoupling  |  source-filter model</text>

<!-- M1 steps -->
<rect x="310" y="192" width="152" height="92" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<text x="386" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">DIO+StoneMask</text>
<text x="386" y="230" text-anchor="middle" font-size="10" fill="#555">F0 extraction</text>
<text x="386" y="248" text-anchor="middle" font-size="10" fill="#777">median → gender</text>
<text x="386" y="266" text-anchor="middle" font-size="10" fill="#777">pitch_ratio × F0</text>
<line x1="462" y1="238" x2="476" y2="238" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="480" y="192" width="152" height="92" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<text x="556" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">CheapTrick</text>
<text x="556" y="230" text-anchor="middle" font-size="10" fill="#555">spectral envelope</text>
<text x="556" y="248" text-anchor="middle" font-size="10" fill="#777">formant_ratio</text>
<text x="556" y="266" text-anchor="middle" font-size="10" fill="#777">frequency warping</text>
<line x1="632" y1="238" x2="646" y2="238" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="650" y="192" width="152" height="92" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<text x="726" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">D4C</text>
<text x="726" y="230" text-anchor="middle" font-size="10" fill="#555">aperiodicity AP</text>
<text x="726" y="248" text-anchor="middle" font-size="10" fill="#777">breath / fricatives</text>
<text x="726" y="266" text-anchor="middle" font-size="10" fill="#777">preserved as-is</text>
<line x1="802" y1="238" x2="816" y2="238" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="820" y="192" width="152" height="92" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<text x="896" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">Synthesize</text>
<text x="896" y="230" text-anchor="middle" font-size="10" fill="#555">WORLD synthesis</text>
<text x="896" y="248" text-anchor="middle" font-size="10" fill="#777">strength blending</text>
<text x="896" y="266" text-anchor="middle" font-size="10" fill="#777">y = mod·s + orig·(1-s)</text>
<line x1="972" y1="238" x2="986" y2="238" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="990" y="192" width="402" height="92" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<text x="1191" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">Output + Visualization</text>
<text x="1191" y="232" text-anchor="middle" font-size="10" fill="#555">converted audio  (pitch + formant controlled)</text>
<text x="1191" y="250" text-anchor="middle" font-size="10" fill="#777">F0 histogram: before vs. after</text>
<text x="1191" y="268" text-anchor="middle" font-size="10" fill="#777">Mel spectrogram comparison</text>

<!-- ══ MODULE 2: VOICE CLONING ══ -->
<rect x="294" y="314" width="1112" height="174" rx="10" fill="#E8F8F5" stroke="#27AE60" stroke-width="1.8"/>
<rect x="294" y="314" width="1112" height="34" rx="10" fill="#1E8449"/><rect x="294" y="336" width="1112" height="12" fill="#1E8449"/>
<text x="850" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="white">Module 2 — Voice Cloning  (Dual-Audio)</text>
<text x="850" y="357" text-anchor="middle" font-size="10.5" fill="#A9DFBF">Deep Learning  |  Zero-Shot Timbre Transfer  |  Speaker Embedding Injection</text>

<rect x="310" y="370" width="536" height="104" rx="7" fill="white" stroke="#27AE60" stroke-width="1.2"/>
<rect x="310" y="370" width="536" height="26" rx="7" fill="#A9DFBF"/><rect x="310" y="384" width="536" height="12" fill="#A9DFBF"/>
<text x="578" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">Path A — FreeVC  (Coqui TTS)</text>
<text x="578" y="412" text-anchor="middle" font-size="10.5" fill="#333">PPG ContentEncoder  →  Speaker Encoder  →  HiFi-GAN decoder</text>
<text x="578" y="430" text-anchor="middle" font-size="10.5" fill="#666">encoder-decoder  |  disentangled content &amp; speaker representation</text>
<text x="578" y="448" text-anchor="middle" font-size="10" fill="#888">condition: PPG content + target embedding + prosody (F0, duration)</text>
<text x="578" y="464" text-anchor="middle" font-size="10" fill="#888">latent space interpolation for stable timbre transfer</text>

<rect x="866" y="370" width="526" height="104" rx="7" fill="white" stroke="#27AE60" stroke-width="1.2"/>
<rect x="866" y="370" width="526" height="26" rx="7" fill="#A9DFBF"/><rect x="866" y="384" width="526" height="12" fill="#A9DFBF"/>
<text x="1129" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#145A32">Path B — OpenVoice v2</text>
<text x="1129" y="412" text-anchor="middle" font-size="10.5" fill="#333">Speaker Embedding extraction  →  ToneColorConverter</text>
<text x="1129" y="430" text-anchor="middle" font-size="10.5" fill="#666">style = (1−τ)·src_style + τ·tgt_style    τ ∈ [0.20, 0.40]</text>
<text x="1129" y="448" text-anchor="middle" font-size="10" fill="#888">τ↑ → more like target  |  τ↓ → more natural / stable</text>
<text x="1129" y="464" text-anchor="middle" font-size="10" fill="#888">zero-shot  |  few-second reference  |  cross-lingual capable</text>

<!-- ══ MODULE 3: SPEAKER SIMILARITY ══ -->
<rect x="294" y="504" width="1112" height="118" rx="10" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="1.8"/>
<rect x="294" y="504" width="1112" height="34" rx="10" fill="#D4AC0D"/><rect x="294" y="526" width="1112" height="12" fill="#D4AC0D"/>
<text x="850" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="white">Module 3 — Speaker Similarity Evaluation</text>
<text x="850" y="547" text-anchor="middle" font-size="10.5" fill="#7D6608">OpenVoice Speaker Encoder  |  Cosine Similarity  |  Reused in Anonymization</text>

<text x="850" y="576" text-anchor="middle" font-size="11" fill="#333">Extract speaker embeddings from both audios  →  cosine(a, b) = a·b / (‖a‖ ‖b‖)  →  score mapped to [0, 100]</text>
<text x="850" y="596" text-anchor="middle" font-size="10.5" fill="#666">Short audio pad mechanism (&lt;6 s auto-extend to prevent extraction failure)</text>
<text x="850" y="612" text-anchor="middle" font-size="10.5" fill="#888">85–100: highly similar  ·  70–85: moderately similar  ·  &lt;70: low similarity</text>

<!-- ══ MODULE 4: ANONYMIZATION ══ -->
<rect x="294" y="638" width="1112" height="152" rx="10" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.8"/>
<rect x="294" y="638" width="1112" height="34" rx="10" fill="#C0392B"/><rect x="294" y="660" width="1112" height="12" fill="#C0392B"/>
<text x="850" y="661" text-anchor="middle" font-size="13" font-weight="700" fill="white">Module 4 — Speech Anonymization  (Core Module)</text>
<text x="850" y="681" text-anchor="middle" font-size="10.5" fill="#F1948A">PPG Decoupling + Target Pool Selection  |  VoicePrivacy Framework  (ASV-EER / ASR-WER)</text>

<text x="850" y="706" text-anchor="middle" font-size="10.5" font-weight="700" fill="#922B21">Preprocess  →  ContentEncoder (PPG)  +  Speaker Embedding (pool)  →  3-Method Anonymization  →  Evaluate</text>

<rect x="310" y="716" width="332" height="60" rx="7" fill="white" stroke="#3498DB" stroke-width="1.2"/>
<rect x="310" y="716" width="332" height="22" rx="7" fill="#AED6F1"/><rect x="310" y="727" width="332" height="11" fill="#AED6F1"/>
<text x="476" y="729" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1A5276">① freevc_baseline</text>
<text x="476" y="750" text-anchor="middle" font-size="10" fill="#555">PPG + embedding direct combination</text>
<text x="476" y="767" text-anchor="middle" font-size="10" fill="#888">highest de-identification  |  source_sim=0.125  |  WER=0.089</text>

<rect x="660" y="716" width="376" height="60" rx="7" fill="white" stroke="#27AE60" stroke-width="1.2"/>
<rect x="660" y="716" width="376" height="22" rx="7" fill="#A9DFBF"/><rect x="660" y="727" width="376" height="11" fill="#A9DFBF"/>
<text x="848" y="729" text-anchor="middle" font-size="10.5" font-weight="700" fill="#145A32">② metric_clarity</text>
<text x="848" y="750" text-anchor="middle" font-size="10" fill="#555">score = α×SpecDist + β×EnvCorr,  select top candidate</text>
<text x="848" y="767" text-anchor="middle" font-size="10" fill="#888">clarity-first  |  best acoustic quality  |  source_sim=0.146</text>

<rect x="1054" y="716" width="338" height="60" rx="7" fill="white" stroke="#8E44AD" stroke-width="1.2"/>
<rect x="1054" y="716" width="338" height="22" rx="7" fill="#D7BDE2"/><rect x="1054" y="727" width="338" height="11" fill="#D7BDE2"/>
<text x="1223" y="729" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4A235A">③ ppg_tone</text>
<text x="1223" y="750" text-anchor="middle" font-size="10" fill="#555">PPG content fidelity priority + tone adjustment</text>
<text x="1223" y="767" text-anchor="middle" font-size="10" fill="#888">content-first  |  envelope closest to original</text>

