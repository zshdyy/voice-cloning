<rect x="1452" y="316" width="220" height="28" rx="8" fill="#D5F5E3"/><rect x="1452" y="332" width="220" height="12" fill="#D5F5E3"/>
<text x="1562" y="334" text-anchor="middle" font-size="11.5" font-weight="700" fill="#145A32">② Cloned Audio</text>
<text x="1562" y="362" text-anchor="middle" font-size="10.5" fill="#444">FreeVC or OpenVoice</text>
<text x="1562" y="380" text-anchor="middle" font-size="10.5" fill="#666">converted output</text>
<text x="1562" y="400" text-anchor="middle" font-size="10.5" fill="#666">+ Speaker Similarity</text>
<text x="1562" y="418" text-anchor="middle" font-size="10.5" fill="#666">  score  (0 – 100)</text>
<text x="1562" y="440" text-anchor="middle" font-size="10.5" fill="#666">+ similarity_*.json</text>
<text x="1562" y="458" text-anchor="middle" font-size="10" fill="#999">cosine similarity</text>

<rect x="1452" y="496" width="220" height="290" rx="8" fill="white" stroke="#27AE60" stroke-width="1.5"/>
<rect x="1452" y="496" width="220" height="28" rx="8" fill="#D5F5E3"/><rect x="1452" y="512" width="220" height="12" fill="#D5F5E3"/>
<text x="1562" y="514" text-anchor="middle" font-size="11.5" font-weight="700" fill="#145A32">③ Anon Audios A/B/C</text>
<text x="1562" y="542" text-anchor="middle" font-size="10.5" fill="#444">3 anonymized variants</text>
<text x="1562" y="560" text-anchor="middle" font-size="10.5" fill="#666">+ VoicePrivacy Report</text>
<line x1="1462" y1="574" x2="1662" y2="574" stroke="#D5F5E3" stroke-width="1.2"/>
